apiVersion: v1
kind: ServiceAccount
metadata:
  name: scarf-sync
  namespace: {{ .Release.Namespace }}
---
# Scoped to just enough to read/write the sync checkpoint ConfigMap: get/update/patch
# are restricted to that one resource name; create has no resourceNames since the
# object doesn't exist until sync.py's first successful run.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: scarf-sync-checkpoint
  namespace: {{ .Release.Namespace }}
rules:
  - apiGroups: [""]
    resources: ["configmaps"]
    verbs: ["create"]
  - apiGroups: [""]
    resources: ["configmaps"]
    resourceNames: ["{{ .Values.sync.checkpointConfigMapName }}"]
    verbs: ["get", "update", "patch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: scarf-sync-checkpoint
  namespace: {{ .Release.Namespace }}
subjects:
  - kind: ServiceAccount
    name: scarf-sync
    namespace: {{ .Release.Namespace }}
roleRef:
  kind: Role
  name: scarf-sync-checkpoint
  apiGroup: rbac.authorization.k8s.io
