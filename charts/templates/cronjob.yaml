apiVersion: batch/v1
kind: CronJob
metadata:
  name: scarf-loki-sync
  namespace: {{ .Release.Namespace }}
  labels:
    app: scarf-sync-pipeline
spec:
  schedule: "*/{{ .Values.sync.intervalMinutes }} * * * *"
  concurrencyPolicy: Forbid  # Prevents overlapping runs if a batch run faces delay
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 5
  jobTemplate:
    spec:
      template:
        metadata:
          labels:
            app: scarf-sync-pipeline
        spec:
          serviceAccountName: scarf-sync
          securityContext:
            # Strictly runs under regular restricted SCC profile with zero root access
            runAsNonRoot: true
            seccompProfile:
              type: RuntimeDefault
          containers:
          - name: sync-worker
            image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
            imagePullPolicy: {{ .Values.image.pullPolicy }}
            securityContext:
              allowPrivilegeEscalation: false
              capabilities:
                drop:
                - ALL
            resources:
              requests:
                memory: "256Mi"
                cpu: "200m"
              limits:
                # The whole window's log lines, parsed events, and per-batch ndjson
                # payloads are all held in memory at once (no streaming), so this is
                # a conservative headroom bump, not a verified-safe number -- revisit
                # once we've load-tested against an actual peak-RPS window.
                memory: "1Gi"
                cpu: "1000m"
            env:
            - name: LOKI_QUERY
              value: {{ .Values.sync.loki.query | quote }}
            - name: ORGANIZATION_NAME
              value: "{{ .Values.sync.scarf.organizationName }}"
            - name: SCARF_BATCH_SIZE
              value: "{{ .Values.sync.scarf.batchSize }}"
            - name: SCARF_MAX_WORKERS
              value: "{{ .Values.sync.scarf.maxWorkers }}"
            - name: SYNC_INTERVAL_MINUTES
              value: "{{ .Values.sync.intervalMinutes }}"
            - name: CHECKPOINT_CONFIGMAP_NAME
              value: "{{ .Values.sync.checkpointConfigMapName }}"
            - name: DEPLOY_ENVIRONMENT
              value: "{{ .Values.environment }}"
            - name: ALERT_AFTER_CONSECUTIVE_FAILURES
              value: "{{ .Values.sync.alerting.afterConsecutiveFailures }}"
            - name: LAG_ALERT_MINUTES
              value: "{{ .Values.sync.alerting.lagMinutes }}"
            envFrom:
            - secretRef:
                name: scarf-loki-credentials
          restartPolicy: OnFailure
