# Default values

name: &name open-vsx-scarf-analytics
environment: &environment staging
platform: &platform okd-c1

image:
  repository: ghcr.io/eclipsefdn/scarf-analytics-pipeline
  tag: latest
  pullPolicy: IfNotPresent

# Secret(s) granting the scarf-sync ServiceAccount pull access to the GHCR image,
# e.g. a `kubectl create secret docker-registry` secret created out-of-band in the
# target namespace. Applied to the ServiceAccount so it survives every `helm upgrade`
# instead of being wiped, since Helm re-creates that ServiceAccount object on every deploy.
imagePullSecrets:
  - dockerconfigjson-for-pull-as-scarf-sync

sync:
  # How often the CronJob fires, and the Loki window sync.py pulls on its very first
  # run (before a checkpoint exists). Must evenly divide 60 (1, 2, 3, 4, 5, 6, 10, 12,
  # 15, 20, 30, 60) so the "*/N" cron schedule below produces evenly spaced ticks.
  intervalMinutes: 5
  # ConfigMap sync.py reads/writes to remember the last successfully-synced timestamp,
  # so a run that takes longer than intervalMinutes resumes where the last one left off
  # instead of losing the gap.
  checkpointConfigMapName: scarf-sync-checkpoint
  # Safety cap: if the checkpoint is older than this (outage, stuck job, etc.), clamp
  # the catch-up query to this many minutes instead of one unbounded Loki query.
  maxLookbackMinutes: 60
  
  loki:
    # url comes from the scarf-loki-credentials Kubernetes secret (LOKI_URL key),
    # not this file -- see README "Configuration".
    query: '{service_name="fastly_cdn", env="production"}'

  scarf:
    organizationName: OpenVSX
    batchSize: 500
    maxWorkers: 10
